name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run crawler
      run: |
        set -o pipefail
        cd ./google_scholar_crawler
        { pip3 install -r requirements.txt && python3 main.py > /dev/null ; } 2>&1 | tee /tmp/crawl.log
      env:
        GOOGLE_SCHOLAR_ID: _Ev2VPoAAAAJ
    - name: Publish results
      run: |
        cd ./google_scholar_crawler/results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Update citation data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
    # Actions logs need auth to read; publish the error tail to a branch
    # so failures can be diagnosed without logging in.
    - name: Publish failure log
      if: failure()
      run: |
        mkdir -p /tmp/dbg && cd /tmp/dbg && git init -q
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        tail -c 8000 /tmp/crawl.log > error.log 2>/dev/null || echo "no log captured" > error.log
        git add error.log && git commit -qm "crawler failure log"
        git push -f "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:crawler-debug
